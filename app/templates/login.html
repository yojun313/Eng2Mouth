<!DOCTYPE html>
<html lang="ko">
<head>
    {% include "_auth_head.html" %}
    <title>Login - Eng2Mouth</title>
</head>
<body class="text-white min-h-[100dvh] flex items-center justify-center relative safe-top safe-bottom">
    <button id="themeSettingsBtn" class="theme-settings-btn safe-top-fixed fixed right-4 z-[100]" type="button" title="테마 설정" aria-label="테마 설정"><i class="fas fa-palette text-sm"></i></button>
    <div class="blob w-96 h-96 bg-blue-600 -top-20 -left-20"></div>
    <div class="blob w-96 h-96 bg-purple-600 top-1/3 -right-24" style="animation-delay: -4s;"></div>
    <div class="blob w-72 h-72 bg-emerald-500 bottom-0 left-1/3" style="animation-delay: -8s;"></div>

    <div class="glass auth-card relative z-10 p-7 md:p-10 rounded-3xl w-full max-w-sm mx-4">
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 shadow-lg shadow-blue-900/40 mb-4"><i class="fas fa-phone-volume text-2xl"></i></div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 via-blue-300 to-purple-300">Eng2Mouth</h1>
            <p class="text-sm text-white/50 mt-1">AI 원어민과 전화로 배우는 영어 회화</p>
        </div>
        <form id="loginForm" class="space-y-4" novalidate>
            <div><label class="block text-xs font-medium mb-1.5 text-white/60">Username</label><input type="text" name="username" required autocomplete="username" autocapitalize="none" class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="아이디"></div>
            <div><label class="block text-xs font-medium mb-1.5 text-white/60">Password</label><input type="password" name="password" required autocomplete="current-password" class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="••••••••"></div>
            <div id="totpRow" class="hidden"><label class="block text-xs font-medium mb-1.5 text-amber-200"><i class="fas fa-shield-halved mr-1"></i>인증 앱 6자리 코드</label><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="w-full px-4 py-3 rounded-xl glass-input text-center tracking-[0.5em] text-xl placeholder-white/20 placeholder:tracking-normal" placeholder="123456"></div>
            <p id="loginError" class="hidden text-xs text-red-300 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2" role="alert"></p>
            <button type="submit" id="loginBtn" class="w-full btn-glow py-3 rounded-xl font-bold transition text-sm mt-2 min-h-[44px]">로그인</button>
        </form>
        <p class="mt-6 text-center text-sm text-white/50">계정이 없으신가요? <a href="/signup" class="text-blue-300 hover:text-blue-200 font-medium hover:underline">회원가입</a> <span class="text-white/25 mx-1">·</span> <a href="/about" class="text-white/50 hover:text-white">서비스 소개</a></p>
    </div>
    <script src="{{ asset('shared/ui.js') }}"></script>
    <script src="{{ asset('js/login.js') }}"></script>
    <script src="{{ asset('shared/theme.js') }}"></script>
</body>
</html>
