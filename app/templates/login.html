<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('e2m_theme_style');if(t&&t!=='default')document.documentElement.setAttribute('data-ui-theme',t);if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-ui-theme-mode','light');}else{document.documentElement.classList.add('dark');}}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Eng2Mouth</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#05070f">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/shared/app.css">
    <style>
        body { background: radial-gradient(circle at 15% 20%, rgba(59,130,246,0.35), transparent 40%), radial-gradient(circle at 85% 15%, rgba(168,85,247,0.30), transparent 45%), radial-gradient(circle at 50% 100%, rgba(16,185,129,0.15), transparent 50%), #05070f; background-attachment: fixed; }
        .blob { position: fixed; border-radius: 9999px; filter: blur(90px); opacity: 0.5; z-index: 0; animation: float 12s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -30px) scale(1.08); } }
        .glass { box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08); }
    </style>
    <link rel="stylesheet" href="/static/shared/theme.css">
</head>
<body class="text-white min-h-[100dvh] flex items-center justify-center overflow-hidden relative">
    <button id="themeSettingsBtn" class="theme-settings-btn" type="button" title="테마 설정" aria-label="테마 설정" style="position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:100;"><i class="fas fa-palette text-sm"></i></button>

    <div class="blob w-96 h-96 bg-blue-600 -top-20 -left-20"></div>
    <div class="blob w-96 h-96 bg-purple-600 top-1/3 -right-24" style="animation-delay: -4s;"></div>
    <div class="blob w-72 h-72 bg-emerald-500 bottom-0 left-1/3" style="animation-delay: -8s;"></div>

    <div class="glass relative z-10 p-8 md:p-10 rounded-3xl w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 shadow-lg shadow-blue-900/40 mb-4">
                <i class="fas fa-phone-volume text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 via-blue-300 to-purple-300">Eng2Mouth</h1>
            <p class="text-sm text-white/50 mt-1">AI 원어민과 전화로 배우는 영어 회화</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Username</label>
                <input type="text" name="username" required autocomplete="username" autocapitalize="none"
                    class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="아이디">
            </div>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="••••••••">
            </div>
            <p id="loginError" class="hidden text-xs text-red-300 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2"></p>
            <button type="submit" id="loginBtn" class="w-full btn-glow py-3 rounded-xl font-bold transition text-sm mt-2">로그인</button>
        </form>

        <p class="mt-6 text-center text-sm text-white/50">
            계정이 없으신가요? <a href="/signup" class="text-blue-300 hover:text-blue-200 font-medium hover:underline">회원가입</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('loginForm'), btn = document.getElementById('loginBtn'), err = document.getElementById('loginError');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true; btn.textContent = '로그인 중...'; err.classList.add('hidden');
            try {
                const res = await fetch('/api/auth/login', { method: 'POST', body: new FormData(form) });
                if (res.ok) { window.location.href = '/'; return; }
                const data = await res.json().catch(() => ({}));
                err.textContent = data.detail || '로그인 실패'; err.classList.remove('hidden');
            } catch (e2) { err.textContent = '네트워크 오류가 발생했습니다.'; err.classList.remove('hidden'); }
            finally { btn.disabled = false; btn.textContent = '로그인'; }
        });
    </script>
    <script src="/static/shared/theme.js"></script>
</body>
</html>
