{% extends "base.html" %}
{% block title %}History - Eng2Mouth{% endblock %}
{% block header %}<i class="fas fa-clock-rotate-left mr-2 text-blue-400"></i>통화 기록{% endblock %}
{% block page_data %}{{ {'call_id': call_id or None} | tojson }}{% endblock %}
{% block content %}
<div class="flex-1 min-h-0 flex">
    <!-- 목록 (모바일: 전체 폭 / lg: 왼쪽 360px) -->
    <section class="md-list min-h-0">
        <div class="p-3 border-b border-white/10 space-y-2 flex-shrink-0">
            <div class="relative">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-white/30 text-sm"></i>
                <input id="q" type="search" class="w-full glass-input rounded-xl pl-10 pr-4 py-2.5 text-base md:text-sm placeholder-white/30" placeholder="주제, 상대, 대화 내용 검색">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <div class="seg" id="kindSeg"><button data-kind="" class="active">전체</button><button data-kind="topic">주제</button><button data-kind="scenario">롤플레이</button><button data-kind="free">자유</button></div>
                <button id="bookmarkFilter" class="btn-ghost px-3 rounded-xl text-xs font-bold whitespace-nowrap"><i class="far fa-star mr-1"></i>북마크</button>
                <span class="chip self-center whitespace-nowrap" id="countLine"></span>
            </div>
        </div>
        <div id="listScroll" class="flex-1 min-h-0 overflow-y-auto p-3 safe-bottom">
            <div id="list" class="space-y-2"></div>
            <div id="moreSentinel" class="h-8 flex items-center justify-center text-[11px] text-white/30"></div>
        </div>
    </section>

    <!-- 상세 (모바일: 오른쪽에서 슬라이드 / lg: 오른쪽 고정) -->
    <section id="detailPane" class="detail-pane min-h-0 hidden lg:flex">
        <header class="safe-top-header lg:!pt-0 lg:!h-14 lg:!min-h-0 h-14 glass border-b border-white/10 flex items-center justify-between px-2 md:px-4 flex-shrink-0 lg:hidden">
            <button id="backBtn" class="icon-btn border-0 bg-transparent text-white/70" aria-label="목록으로"><i class="fas fa-chevron-left text-lg"></i></button>
            <h3 class="text-sm font-bold truncate flex-1 text-center px-2" id="paneTitle">통화 상세</h3>
            <div class="flex items-center gap-1">
                <button id="bookmarkBtn" class="icon-btn border-0 bg-transparent" aria-label="북마크"><i class="far fa-star"></i></button>
                <button id="moreBtn" class="icon-btn border-0 bg-transparent" aria-label="더 보기"><i class="fas fa-ellipsis"></i></button>
            </div>
        </header>
        <div id="detailBody" class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 safe-bottom">
            <div class="h-full flex flex-col items-center justify-center text-white/30 text-sm"><i class="fas fa-phone-volume text-4xl mb-3 opacity-40"></i>왼쪽에서 통화를 선택하세요</div>
        </div>
    </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/history.js') }}"></script>{% endblock %}
