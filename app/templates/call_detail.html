{% extends "base.html" %}
{% block title %}Call Detail - Eng2Mouth{% endblock %}
{% block header %}<a href="/history" class="text-white/50 hover:text-white mr-2"><i class="fas fa-chevron-left"></i></a><span id="hdrTitle">통화 상세</span>{% endblock %}
{% block header_actions %}
<button id="bookmarkBtn" class="theme-settings-btn" title="북마크" aria-label="북마크"><i class="far fa-star text-sm"></i></button>
<button id="deleteBtn" class="theme-settings-btn hover:!text-red-300" title="삭제" aria-label="삭제"><i class="fas fa-trash text-sm"></i></button>
{% endblock %}
{% block content %}
<div class="flex-1 overflow-y-auto p-4 md:p-6 page-scroll">
    <div class="max-w-6xl mx-auto" id="root"><p class="text-center text-white/40 text-sm py-10"><i class="fas fa-spinner fa-spin mr-2"></i>불러오는 중…</p></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    const CALL_ID = {{ call_id | tojson }};
    let doc = null, saved = new Set();
    const LABELS = { fluency: '유창성', grammar: '문법', vocabulary: '어휘', coherence: '논리/구성', interaction: '상호작용' };
    const LEVEL_KO = { beginner: '초급', intermediate: '중급', advanced: '고급' };
    async function load() {
        doc = await api(`/api/calls/${CALL_ID}`); saved = new Set(doc.saved_phrases || []);
        render();
    }
    function render() {
        const t = doc.topic || {}, p = doc.persona || {}, ev = doc.evaluation, st = doc.stats || {};
        document.getElementById('hdrTitle').textContent = t.title_ko || t.title || '통화 상세';
        document.querySelector('#bookmarkBtn i').className = `${doc.bookmarked ? 'fas text-amber-300' : 'far'} fa-star text-sm`;
        const root = document.getElementById('root');
        root.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div class="lg:col-span-5 space-y-4">
                <section class="glass-strong rounded-3xl p-5">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${p.gradient || 'from-blue-500 to-purple-500'} flex items-center justify-center text-3xl shadow-lg flex-shrink-0">${p.emoji || '📞'}</div>
                        <div class="min-w-0">
                            <h2 class="text-lg font-extrabold leading-tight">${esc(t.emoji || '')} ${esc(t.title_ko || t.title || '')}</h2>
                            <p class="text-xs text-white/50 mt-0.5">${esc(t.title || '')}</p>
                            <p class="text-xs text-white/60 mt-1">${[p.name, p.title, LEVEL_KO[doc.level]].filter(Boolean).map(esc).join(' · ')}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-4 text-center">
                        <div class="glass-soft rounded-xl p-2"><p class="text-[10px] text-white/45">통화 시간</p><p class="font-extrabold tabular">${fmtDur(doc.duration_sec)}</p></div>
                        <div class="glass-soft rounded-xl p-2"><p class="text-[10px] text-white/45">내 단어</p><p class="font-extrabold tabular">${st.user_words ?? 0}</p></div>
                        <div class="glass-soft rounded-xl p-2"><p class="text-[10px] text-white/45">발화 비중</p><p class="font-extrabold tabular">${st.talk_share ?? 0}%</p></div>
                        <div class="glass-soft rounded-xl p-2"><p class="text-[10px] text-white/45">분당 단어</p><p class="font-extrabold tabular">${st.words_per_minute ?? 0}</p></div>
                        <div class="glass-soft rounded-xl p-2"><p class="text-[10px] text-white/45">고유 단어</p><p class="font-extrabold tabular">${st.unique_words ?? 0}</p></div>
                        <div class="glass-soft rounded-xl p-2"><p class="text-[10px] text-white/45">최장 발화</p><p class="font-extrabold tabular">${st.longest_turn_words ?? 0}<span class="text-[10px] font-normal text-white/40">단어</span></p></div>
                    </div>
                    <p class="text-[10px] text-white/35 mt-3">${fmtDate(doc.started_at)}${t.kind === 'scenario' ? ` · 롤플레이 (AI: ${esc(t.ai_role || '')})` : ''}</p>
                    <div class="glass-soft rounded-xl p-3 mt-3 flex items-center justify-between"><div><p class="text-[10px] text-white/45"><i class="fas fa-coins mr-1 text-amber-300"></i>이 통화 비용 (평가 포함 · 추정)</p><p class="text-lg font-extrabold tabular">${fmtKrw(doc.cost_krw)} <span class="text-xs font-normal text-white/50">≈ $${(doc.cost_usd || 0).toFixed(4)}</span></p></div><p class="text-[10px] text-white/35 text-right">${esc(doc.provider || '')}<br>${esc(doc.model || '')}<br>환율 ${Number(doc.usd_krw || 0).toLocaleString('ko-KR')}원/$</p></div>
                    <div class="flex gap-2 mt-4">
                        <a href="/call?kind=${t.kind === 'scenario' ? 'scenario' : t.kind === 'free' ? 'free' : (t.id === 'custom' ? 'custom&title=' + encodeURIComponent(t.title || '') : 'topic')}&id=${encodeURIComponent(t.id || '')}" class="btn-call flex-1 py-2.5 rounded-xl text-sm font-bold text-center"><i class="fas fa-phone mr-1"></i>같은 주제로 다시</a>
                        <button id="copyBtn" class="btn-ghost px-3 rounded-xl text-sm" title="대화 복사"><i class="fas fa-copy"></i></button>
                    </div>
                </section>
                <section class="glass rounded-2xl p-4">
                    <p class="text-xs font-bold text-white/50 uppercase tracking-wider mb-2"><i class="fas fa-note-sticky mr-1 text-amber-300"></i>내 메모</p>
                    <textarea id="noteInput" rows="3" class="w-full glass-input rounded-xl p-3 text-sm resize-none" placeholder="이 통화에서 기억하고 싶은 것">${esc(doc.note || '')}</textarea>
                    <p class="text-[10px] text-white/35 mt-1" id="noteStatus">입력하면 자동 저장됩니다.</p>
                </section>
                <section class="glass rounded-2xl overflow-hidden">
                    <div class="p-4 border-b border-white/10 flex items-center justify-between"><p class="text-xs font-bold text-white/50 uppercase tracking-wider"><i class="fas fa-comments mr-1 text-blue-300"></i>대화 전문 <span class="normal-case font-normal text-white/35">(${(doc.transcript || []).length}턴)</span></p><button id="playAllBtn" class="text-[11px] text-white/50 hover:text-white"><i class="fas fa-highlighter mr-1"></i>내 말만 보기</button></div>
                    <div id="transcript" class="p-4 space-y-2 max-h-[60vh] overflow-y-auto">${(doc.transcript || []).map((x, i) => `<div class="flex ${x.role === 'user' ? 'justify-end' : ''} turn-${x.role}"><div class="max-w-[85%] px-3 py-2 rounded-2xl text-sm leading-relaxed ${x.role === 'user' ? 'bg-blue-500/30 rounded-br-md' : 'bg-white/10 rounded-bl-md'}"><p>${esc(x.text)}</p>${x.role === 'assistant' ? `<button class="tr-btn text-[10px] text-white/45 hover:text-white mt-1" data-i="${i}"><i class="fas fa-language mr-1"></i>번역</button><span class="tr-out block text-[11px] text-emerald-200 mt-1"></span>` : ''}</div></div>`).join('') || '<p class="text-xs text-white/40 text-center py-6">저장된 대화가 없습니다.</p>'}</div>
                </section>
            </div>
            <div class="lg:col-span-7 space-y-4" id="evalCol">${ev ? evalHtml(ev) : `<div class="glass rounded-2xl p-8 text-center"><i class="fas fa-wand-magic-sparkles text-3xl text-purple-300 mb-3"></i><p class="text-sm text-white/70 mb-4">아직 평가 리포트가 없습니다.</p><button id="evalBtn" class="btn-glow px-6 py-3 rounded-xl font-bold text-sm">지금 평가하기</button><p class="text-[10px] text-white/35 mt-2">내 API Key 로 GPT 평가 (약 $0.005~0.02)</p></div>`}</div>
        </div>`;
        bind();
    }
    function evalHtml(ev) {
        const S = ev.scores || {};
        return `
        <section class="glass-strong rounded-3xl p-5">
            <div class="flex items-center gap-5">
                <div class="relative w-28 h-28 flex-shrink-0"><svg viewBox="0 0 100 100" class="w-full h-full -rotate-90"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="${scoreColor(ev.overall)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="${264 - 264 * ev.overall / 100}"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-3xl font-extrabold tabular">${ev.overall}</span><span class="text-[10px] text-white/50">/100</span></div></div>
                <div class="min-w-0"><p class="text-[10px] font-bold text-white/45 uppercase">종합 평가</p><p class="text-3xl font-extrabold">${esc(ev.cefr)} <span class="text-sm text-white/50 font-semibold">CEFR</span></p><p class="text-sm text-white/65 mt-1 leading-relaxed">${esc(ev.summary_ko)}</p></div>
            </div>
            <div class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2">${Object.keys(LABELS).map((k) => `<div class="flex items-center gap-3 text-xs"><span class="w-16 text-white/60">${LABELS[k]}</span><div class="score-track flex-1"><div class="score-fill" style="width:${S[k] || 0}%;background:${scoreColor(S[k] || 0)}"></div></div><span class="w-7 text-right font-bold tabular">${S[k] ?? '-'}</span></div>`).join('')}</div>
        </section>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <section class="glass rounded-2xl p-4"><p class="text-xs font-bold text-emerald-300 mb-2"><i class="fas fa-thumbs-up mr-1"></i>잘한 점</p><ul class="text-sm text-white/75 space-y-1.5 list-disc list-inside">${(ev.strengths || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul></section>
            <section class="glass rounded-2xl p-4"><p class="text-xs font-bold text-amber-300 mb-2"><i class="fas fa-bullseye mr-1"></i>보완할 점</p><ul class="text-sm text-white/75 space-y-1.5 list-disc list-inside">${(ev.improvements || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul></section>
        </div>
        ${(ev.corrections || []).length ? `<section class="glass rounded-2xl p-4"><p class="text-xs font-bold text-red-300 mb-3"><i class="fas fa-pen mr-1"></i>이렇게 고쳐 말해요</p><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${ev.corrections.map((c) => `<div class="glass-soft rounded-xl p-3 text-sm"><p class="text-white/50 line-through decoration-red-400/60 text-[13px]">${esc(c.original)}</p><p class="font-bold text-emerald-200 mt-0.5">${esc(c.better)}</p><p class="text-[11px] text-white/50 mt-1">${esc(c.why_ko)}</p><div class="flex gap-3 mt-2">${saveBtn(c.better, c.why_ko, c.original, 'correction')}<button class="speak-btn text-[11px] text-white/50 hover:text-white" data-text="${esc(c.better)}"><i class="fas fa-volume-high mr-1"></i>듣기</button></div></div>`).join('')}</div></section>` : ''}
        ${(ev.expressions || []).length ? `<section class="glass rounded-2xl p-4"><p class="text-xs font-bold text-blue-300 mb-3"><i class="fas fa-star mr-1"></i>가져갈 표현</p><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${ev.expressions.map((x) => `<div class="glass-soft rounded-xl p-3 text-sm"><p class="font-bold">${esc(x.phrase)}</p><p class="text-xs text-white/60">${esc(x.meaning_ko)}</p><p class="text-[12px] text-white/50 italic mt-1">“${esc(x.example)}”</p><div class="flex gap-3 mt-2">${saveBtn(x.phrase, x.meaning_ko, x.example, 'expression')}<button class="speak-btn text-[11px] text-white/50 hover:text-white" data-text="${esc(x.phrase)}"><i class="fas fa-volume-high mr-1"></i>듣기</button></div></div>`).join('')}</div></section>` : ''}
        ${(ev.filler_words || []).length ? `<div class="glass-soft rounded-2xl p-3 text-xs text-white/60"><i class="fas fa-comment-slash mr-1 text-white/40"></i>자주 쓴 군말: ${ev.filler_words.map((f) => `<span class="chip mx-0.5">${esc(f)}</span>`).join('')}</div>` : ''}
        <section class="glass rounded-2xl p-4"><p class="text-xs font-bold text-purple-300 mb-2"><i class="fas fa-flag-checkered mr-1"></i>다음 통화 목표</p><ul class="text-sm text-white/75 space-y-1.5 list-disc list-inside">${(ev.next_goals || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul><p class="text-[10px] text-white/30 mt-3">평가 모델 ${esc(ev.model || '')} · ${fmtDate(ev.evaluated_at)}</p></section>`;
    }
    function saveBtn(phrase, meaning, example, kind) {
        const done = saved.has(phrase);
        return `<button class="save-phrase text-[11px] ${done ? 'text-emerald-300' : 'text-blue-300 hover:text-blue-200'}" ${done ? 'disabled' : ''} data-phrase="${esc(phrase)}" data-meaning="${esc(meaning)}" data-example="${esc(example)}" data-kind="${kind}"><i class="${done ? 'fas' : 'far'} fa-bookmark mr-1"></i>${done ? '저장됨' : '노트에 저장'}</button>`;
    }
    function bind() {
        document.querySelectorAll('.save-phrase:not([disabled])').forEach((b) => b.addEventListener('click', async () => { try { const d = await api('/api/phrases', { method: 'POST', body: { phrase: b.dataset.phrase, meaning_ko: b.dataset.meaning, example: b.dataset.example, kind: b.dataset.kind, source_call_id: CALL_ID } }); b.innerHTML = '<i class="fas fa-bookmark mr-1"></i>저장됨'; b.className = 'save-phrase text-[11px] text-emerald-300'; b.disabled = true; toast(d.status === 'exists' ? '이미 노트에 있어요' : '표현 노트에 저장했어요'); } catch (e) { toast(e.message, false); } }));
        document.querySelectorAll('.speak-btn').forEach((b) => b.addEventListener('click', async () => { const orig = b.innerHTML; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; try { const res = await fetch('/api/assist/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: b.dataset.text }) }); if (!res.ok) throw new Error((await res.json()).detail); new Audio(URL.createObjectURL(await res.blob())).play(); } catch (e) { toast(e.message || '재생 실패', false); } finally { b.innerHTML = orig; } }));
        document.querySelectorAll('.tr-btn').forEach((b) => b.addEventListener('click', async () => { const out = b.nextElementSibling; out.textContent = '번역 중…'; try { const d = await api('/api/assist/translate', { method: 'POST', body: { text: doc.transcript[+b.dataset.i].text } }); out.textContent = d.ko + (d.notes ? ` (${d.notes})` : ''); b.remove(); } catch (e) { out.textContent = e.message; } }));
        document.getElementById('evalBtn')?.addEventListener('click', async (e) => { const btn = e.currentTarget; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>평가 중… (10~30초)'; try { const d = await api(`/api/calls/${CALL_ID}/evaluate`, { method: 'POST' }); doc.evaluation = d.evaluation; render(); toast('평가가 완료됐어요!'); } catch (err) { toast(err.message, false, 5000); btn.disabled = false; btn.textContent = '지금 평가하기'; } });
        let noteTimer = null; document.getElementById('noteInput').addEventListener('input', (e) => { clearTimeout(noteTimer); document.getElementById('noteStatus').textContent = '저장 대기…'; noteTimer = setTimeout(async () => { try { await api(`/api/calls/${CALL_ID}`, { method: 'PATCH', body: { note: e.target.value } }); document.getElementById('noteStatus').textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR'); } catch (err) { document.getElementById('noteStatus').textContent = '저장 실패'; } }, 800); });
        let onlyMe = false; document.getElementById('playAllBtn').addEventListener('click', (e) => { onlyMe = !onlyMe; document.querySelectorAll('.turn-assistant').forEach((el) => el.classList.toggle('hidden', onlyMe)); e.currentTarget.innerHTML = onlyMe ? '<i class="fas fa-comments mr-1"></i>전체 보기' : '<i class="fas fa-highlighter mr-1"></i>내 말만 보기'; });
        document.getElementById('copyBtn').addEventListener('click', async () => { const txt = (doc.transcript || []).map((x) => `${x.role === 'user' ? '나' : (doc.persona?.name || 'AI')}: ${x.text}`).join('\n'); try { await navigator.clipboard.writeText(txt); toast('대화 내용을 복사했어요'); } catch (e) { toast('복사 실패', false); } });
    }
    document.getElementById('bookmarkBtn').addEventListener('click', async () => { doc.bookmarked = !doc.bookmarked; await api(`/api/calls/${CALL_ID}`, { method: 'PATCH', body: { bookmarked: doc.bookmarked } }); document.querySelector('#bookmarkBtn i').className = `${doc.bookmarked ? 'fas text-amber-300' : 'far'} fa-star text-sm`; toast(doc.bookmarked ? '북마크에 추가' : '북마크 해제'); });
    document.getElementById('deleteBtn').addEventListener('click', async () => { if (!confirm('이 통화 기록을 삭제할까요? 되돌릴 수 없습니다.')) return; await api(`/api/calls/${CALL_ID}`, { method: 'DELETE' }); location.href = '/history'; });
    load().catch((e) => { document.getElementById('root').innerHTML = `<p class="text-center text-red-300 text-sm py-10">${esc(e.message)}</p>`; });
</script>
{% endblock %}
