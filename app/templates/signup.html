<!DOCTYPE html>
<html lang="ko">
<head>
    {% include "_auth_head.html" %}
    <title>Sign Up - Eng2Mouth</title>
    <style>.glass-input:focus { border-color: rgba(52,211,153,0.6); box-shadow: 0 0 0 3px rgba(16,185,129,0.15); } .btn-green { background: linear-gradient(135deg, #10b981, #3b82f6); box-shadow: 0 8px 24px rgba(16,185,129,0.3); color: #fff; }</style>
</head>
<body class="text-white min-h-[100dvh] flex items-center justify-center relative safe-top safe-bottom">
    <button id="themeSettingsBtn" class="theme-settings-btn safe-top-fixed fixed right-4 z-[100]" type="button" title="테마 설정" aria-label="테마 설정"><i class="fas fa-palette text-sm"></i></button>
    <div class="blob w-96 h-96 bg-emerald-500 -top-20 -left-20"></div>
    <div class="blob w-96 h-96 bg-blue-600 top-1/3 -right-24" style="animation-delay: -4s;"></div>
    <div class="blob w-72 h-72 bg-purple-600 bottom-0 left-1/3" style="animation-delay: -8s;"></div>

    <div class="glass auth-card relative z-10 p-7 md:p-10 rounded-3xl w-full max-w-sm mx-4 my-3">
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-blue-600 shadow-lg shadow-emerald-900/40 mb-4"><i class="fas fa-user-plus text-2xl"></i></div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 to-blue-300">Sign Up</h1>
            <p class="text-sm text-white/50 mt-1">Eng2Mouth 계정을 새로 만드세요</p>
        </div>
        <form id="signupForm" class="space-y-4" data-require-email="{{ 'true' if require_email else 'false' }}">
            <div><label class="block text-xs font-medium mb-1.5 text-white/60">Username <span class="text-white/30">(영문/숫자 3~24자)</span></label><input type="text" name="username" required autocomplete="username" autocapitalize="none" pattern="[a-zA-Z0-9_.\-]{3,24}" class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="사용할 아이디"></div>
            <div><label class="block text-xs font-medium mb-1.5 text-white/60">Email{% if not require_email %} <span class="text-white/30">(선택)</span>{% endif %}</label><input type="email" name="email" id="inputEmail" {% if require_email %}required{% endif %} autocomplete="email" class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="you@example.com"></div>
            <div><label class="block text-xs font-medium mb-1.5 text-white/60">Password <span class="text-white/30">(6자 이상)</span></label><input type="password" name="password" required minlength="6" autocomplete="new-password" class="w-full px-4 py-3 rounded-xl glass-input text-base md:text-sm placeholder-white/30" placeholder="••••••••"></div>
            <p id="signupError" class="hidden text-xs text-red-300 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2" role="alert"></p>
            <button type="submit" id="sendBtn" class="w-full btn-green py-3 rounded-xl font-bold transition text-sm mt-2 min-h-[44px]">{% if require_email %}인증 메일 발송{% else %}가입하기{% endif %}</button>
        </form>
        <div id="verifySection" class="hidden mt-6 space-y-4 border-t border-white/10 pt-6">
            <p class="text-xs text-amber-300/90 text-center flex items-center justify-center gap-1.5"><i class="fas fa-envelope-open-text"></i> 이메일로 전송된 6자리 인증 코드를 입력하세요.</p>
            <input type="text" id="verifyCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6" class="w-full px-4 py-3 rounded-xl glass-input text-center tracking-[0.5em] text-xl placeholder-white/20 placeholder:tracking-normal">
            <button id="verifyBtn" class="w-full btn-glow py-3 rounded-xl font-bold transition text-sm min-h-[44px]">확인 및 가입 완료</button>
        </div>
        <p class="mt-6 text-center text-sm text-white/50">이미 계정이 있으신가요? <a href="/login" class="text-emerald-300 hover:text-emerald-200 font-medium hover:underline">로그인</a></p>
    </div>
    <script src="/static/shared/ui.js"></script>
    <script src="/static/js/signup.js"></script>
    <script src="/static/shared/theme.js"></script>
</body>
</html>
