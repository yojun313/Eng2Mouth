{% extends "base.html" %}
{% block title %}Topics - Eng2Mouth{% endblock %}
{% block header %}<i class="fas fa-compass mr-2 text-blue-400"></i>주제 탐색{% endblock %}
{% block content %}
<div class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 safe-bottom">
    <div class="max-w-6xl mx-auto space-y-4">
        <div class="glass rounded-2xl p-3 md:p-4 flex flex-col md:flex-row gap-3 md:items-center">
            <div class="relative flex-1 min-w-0">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-white/30 text-sm"></i>
                <input id="q" type="search" class="w-full glass-input rounded-xl pl-10 pr-4 py-2.5 text-base md:text-sm placeholder-white/30" placeholder="주제 검색 (한글/영어)">
            </div>
            <div class="seg overflow-x-auto no-scrollbar" id="kindSeg">
                <button data-kind="topic" class="active">대화 주제 <span class="opacity-60" id="cntTopic"></span></button>
                <button data-kind="scenario">롤플레이 <span class="opacity-60" id="cntScn"></span></button>
            </div>
        </div>
        <div id="catRow" class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 md:mx-0 md:px-0"></div>
        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/topics.js') }}"></script>{% endblock %}
