{% extends "base.html" %}
{% block title %}Phrases - Eng2Mouth{% endblock %}
{% block header %}<i class="fas fa-bookmark mr-2 text-blue-400"></i>표현 노트{% endblock %}
{% block header_actions %}<button id="quizBtn" class="btn-ghost px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap"><i class="fas fa-graduation-cap mr-1 text-purple-300"></i>복습 퀴즈</button>{% endblock %}
{% block content %}
<div class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 safe-bottom">
    <div class="max-w-4xl mx-auto space-y-4">
        <div class="glass rounded-2xl p-3 md:p-4 flex flex-col md:flex-row gap-3 md:items-center">
            <div class="relative flex-1 min-w-0"><i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-white/30 text-sm"></i><input id="q" type="search" class="w-full glass-input rounded-xl pl-10 pr-4 py-2.5 text-base md:text-sm placeholder-white/30" placeholder="표현 / 뜻 검색"></div>
            <div class="seg" id="seg"><button data-v="" class="active">전체</button><button data-v="0">복습 필요 <span id="cntDue" class="opacity-60"></span></button><button data-v="1">익힘</button></div>
        </div>
        <form id="addForm" class="glass rounded-2xl p-3 md:p-4 grid grid-cols-[minmax(0,1fr)] md:grid-cols-[1fr_1fr_auto] gap-2">
            <input id="addPhrase" class="glass-input rounded-xl px-3 py-2.5 text-base md:text-sm min-w-0" placeholder="직접 추가: 영어 표현" required>
            <input id="addMeaning" class="glass-input rounded-xl px-3 py-2.5 text-base md:text-sm min-w-0" placeholder="뜻 (한국어)">
            <button class="btn-glow px-4 py-2.5 rounded-xl text-sm font-bold"><i class="fas fa-plus mr-1"></i>추가</button>
        </form>
        <p class="text-xs text-white/40 px-1" id="countLine"></p>
        <div id="list" class="grid grid-cols-[minmax(0,1fr)] md:grid-cols-2 gap-3"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/phrases.js') }}"></script>{% endblock %}
